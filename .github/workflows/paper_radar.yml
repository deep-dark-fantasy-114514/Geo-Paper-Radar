name: Geo Paper Radar Daily (Harvest)

# ★ 2026-10-01 改造：云端不再打分、不发邮件、不花钱。
#
# 为什么：升级后的流程里，打分要本地 Qwen、下载/重命名要本地视觉模型、
# 归档要本地磁盘和 EndNote —— 云端（ubuntu runner）一样都没有。
# 而本机是【笔记本】，合盖就睡，定时任务跑不了。
#
# 所以分工成两半：
#   · 云端（本文件）：每天只【抓取】，把候选存成 harvest/YYYY-MM-DD.json 提交回仓库。
#                     不调任何付费 API，secret 一个都不需要。
#   · 本机（10:00 的 Windows 计划任务）：用 raw HTTP 回捞这些候选，
#                     合并后跑完整流程（本地打分 → 下载 → 重命名 → 归档 → 简报）。
#   ⇒ 笔记本睡几天也不漏文献。
#
# 注意：harvest 模式不读 .env，所以本地那套 DeepSeek / SMTP 密钥在云端已无必要。

on:
  schedule:
    # 每天北京时间 8:07 = UTC 0:07（错峰避免整点拥堵）
    - cron: '7 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # 允许把候选提交回仓库

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取候选（不打分、不发邮件）
        env:
          PAPER_RADAR_MODE: harvest
          # ★ 2026-10-01：OpenAlex 从 2026-02-13 起强制要求 API key
          #（mailto 礼貌池已废弃）。没有 key 时 6 组查询会全部 429，
          #  OpenAlex 覆盖全丢 —— 而它是主力源。
          # 需要在仓库 Settings → Secrets and variables → Actions 里
          # 新建一个叫 OPENALEX_API_KEY 的 secret。
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python paper_radar.py

      - name: 清理过期候选（保留 14 天，控制仓库体积）
        run: |
          find harvest -name '*.json' -mtime +14 -print -delete 2>/dev/null || true

      - name: 提交候选
        if: success()
        run: |
          git config user.name "Geo-Paper-Radar-Bot"
          git config user.email "bot@geo-paper-radar.local"
          git add harvest/ history.json
          git diff --staged --quiet || (
            git commit -m "Auto: 云端候选 $(date +%Y-%m-%d)" &&
            git push
          )
